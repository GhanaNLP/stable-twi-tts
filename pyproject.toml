[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-twi-tts"
version = "0.1.0"
description = "Twi and Ghanaian English speech synthesis on ONNX"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "onnxruntime>=1.16",
    "numpy>=1.21",
]

[project.optional-dependencies]
# Downloading the published voice with from_pretrained().
hub = ["huggingface_hub>=0.24"]
# Local web UI: text, PDF or URL in, audio out.
web = [
    "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9",
    "huggingface_hub>=0.24", "pypdf>=4.0", "trafilatura>=1.8",
]
# Twi needs ghana-g2p. Its own wheel build is currently broken upstream (africa-g2p ships
# data/ twice, so hatchling refuses the archive), hence the direct git references.
twi = [
    "africa-g2p @ git+https://github.com/AfriSpeech/africa-g2p",
    "ghana-g2p @ git+https://github.com/GhanaNLP/ghana-g2p",
]

[project.scripts]
stable-twi-tts = "stable_twi_tts.cli:main"
stable-twi-tts-web = "stable_twi_tts.web:main"

[tool.setuptools]
packages = ["stable_twi_tts"]

[tool.setuptools.package-data]
stable_twi_tts = ["static/*.html"]
